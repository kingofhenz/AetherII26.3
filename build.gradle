plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
    id 'maven-publish'
    id 'idea'
}

version = "${mod_version}"
group = mod_group

base {
    archivesName = "${mod_id}-fabric"
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'Aether Cumulus'
        url = 'https://packages.aether-mod.net/Cumulus'
    }
    maven {
        name = 'Fuzs Maven'
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}


dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Nitrogen has no Fabric build for 26.3; the parts The Aether II uses are bundled in com.aetherteam.aetherii.nitrogen.
    // Cumulus (custom title-screen menus) has no 26.3 Fabric build yet; it is an optional integration, loaded only via its own entrypoint.
    compileOnly "com.aetherteam.cumulus:cumulus_menus:${cumulus_version}"
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
    compileOnly "maven.modrinth:sodium:mc26.3-0.9.3-fabric"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

fabricApi {
    configureDataGeneration {
        client = true
        modId = project.mod_id // only run this mod's datagen: Nitrogen/Cumulus entrypoints would purge our generated files as stale
        outputDirectory = file("src/generated/resources")
    }
}

loom {
    accessWidenerPath = file("src/main/resources/aether_ii.accesswidener")
}

processResources {
    exclude '.cache/'

    def expandProps = [
            mod_id          : project.mod_id,
            version         : project.version,
            mod_name        : project.mod_name,
            mod_description : project.mod_description,
            mod_credits     : project.mod_credits,
            mod_url         : project.mod_url,
            mod_tracker     : project.mod_tracker,
            mod_license     : project.mod_license,
            loader_version  : project.loader_version,
            minecraft_version: project.minecraft_version
    ]
    inputs.properties(expandProps)
    filesMatching('fabric.mod.json') {
        expand(expandProps)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xmaxerrs" << "9000"
}

tasks.register('sourceJar', Jar) {
    dependsOn 'classes'
    from sourceSets.main.allSource
    archiveClassifier = 'sources'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId project.base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/The-Aether-Team/The-Aether-II"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
// Regression checks (src/regression) are only wired up when that source set exists in the project.
if (file('src/regression').exists()) {
    // Regression coverage for Fabric mutable attachment synchronization, without launching a game.
    sourceSets {
        regression {
            compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
            runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        }
    }
    tasks.register('verifyAttachmentSync', JavaExec) {
        dependsOn tasks.named('regressionClasses')
        classpath = sourceSets.regression.runtimeClasspath
        mainClass = 'com.aetherteam.aetherii.attachment.AttachmentSyncRegressionTest'
    }
    tasks.named('check') {
        dependsOn tasks.named('verifyAttachmentSync')
    }

    // Preserve the exact surface palette while removing per-block noise construction.
    tasks.register('verifyWorldgen', JavaExec) {
        dependsOn tasks.named('regressionClasses')
        classpath = sourceSets.regression.runtimeClasspath
        mainClass = 'com.aetherteam.aetherii.world.WorldgenRegressionTest'
    }
    tasks.named('check') { dependsOn tasks.named('verifyWorldgen') }
}
